[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicane-intensity"
version = "0.1.0"
description = "SEVIRI image-motion diagnostics for medicane intensity research"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<2",
  "opencv-python>=4.8",
  "matplotlib>=3.7",
  "imageio>=2.31",
]

[project.optional-dependencies]
seviri = ["satpy>=0.51", "xarray>=2023.12"]

[tool.setuptools.packages.find]
where = ["src"]

